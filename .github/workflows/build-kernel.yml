name: 编译内核 (LLVM 23)

# 手动触发；也可以直接往 android12 分支 push 自动触发
on:
  workflow_dispatch:
    inputs:
      make_release:
        description: 构建成功后自动发布 Release
        type: boolean
        default: true
  push:
    branches:
      - android12

# 发布 Release 需要写权限
permissions:
  contents: write

env:
  # 内嵌进内核版本信息的编译者
  KBUILD_BUILD_USER: "XinRan♡"
  KBUILD_BUILD_HOST: "Bai"

  # LLVM 工具链（官方发布包，Linux-X64 适用于 x86_64 runner）
  LLVM_VERSION: 23.1.2
  LLVM_DIR: LLVM-23.1.2-Linux-X64

  # ccache：后续编译加速
  CCACHE_MAXSIZE: 5G
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: time_macros,file_stat_matches,include_file_ctime,include_file_mtime

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: 拉取内核源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          PKGS="build-essential libssl-dev bc flex bison dwarves git zip unzip \
                curl wget tar xz-utils cpio rsync python3 python3-pip \
                python-is-python3 make cmake openjdk-17-jdk repo ccache lzop \
                zstd libncurses-dev libffi-dev libbz2-dev gnupg dnsutils \
                net-tools lsb-release aria2 pigz jq parallel sudo \
                binutils-aarch64-linux-gnu binutils-arm-linux-gnueabihf neofetch"
          sudo apt-get install -y -qq $PKGS || {
            echo "批量安装失败，改为逐个安装（确实不存在的包会跳过）"
            for p in $PKGS; do
              sudo apt-get install -y -qq "$p" || echo "缺少软件包: $p"
            done
          }

      # 完整解压后工具链约 12G，优先放到 runner 的大容量 /mnt，放不下再退回工作区
      - name: 选择工具链目录
        id: tc
        run: |
          avail=$(df -BG --output=avail /mnt 2>/dev/null | tail -1 | tr -dc '0-9')
          if [ -d /mnt ] && [ -n "$avail" ] && [ "$avail" -gt 20 ]; then
            echo "dir=/mnt/llvm23" >> "$GITHUB_OUTPUT"
          else
            echo "dir=$GITHUB_WORKSPACE/toolchain" >> "$GITHUB_OUTPUT"
          fi
          df -h / /mnt 2>/dev/null || true
          cat "$GITHUB_OUTPUT"

      - name: 恢复 LLVM 工具链缓存
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.tc.outputs.dir }}
          key: llvm-${{ runner.os }}-${{ env.LLVM_VERSION }}

      - name: 下载并解压 LLVM ${{ env.LLVM_VERSION }}
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/${LLVM_DIR}.tar.xz"
          echo "下载 $URL"
          wget -q --show-progress -O "$RUNNER_TEMP/llvm.tar.xz" "$URL"
          mkdir -p "${{ steps.tc.outputs.dir }}"
          tar -xJf "$RUNNER_TEMP/llvm.tar.xz" -C "${{ steps.tc.outputs.dir }}"
          rm -f "$RUNNER_TEMP/llvm.tar.xz"
          du -sh "${{ steps.tc.outputs.dir }}"

      - name: 配置工具链到 PATH
        run: echo "${{ steps.tc.outputs.dir }}/${{ env.LLVM_DIR }}/bin" >> "$GITHUB_PATH"

      - name: 检查工具链
        run: |
          clang --version
          ld.lld --version
          llvm-ar --version | head -1

      # 如果链接阶段报 libicui18n.so.70 之类缺失，说明 runner 上没有 lld 需要的 ICU，
      # 把下面这段取消注释即可：
      #
      # - name: 补齐 lld 运行库
      #   run: |
      #     cd "$RUNNER_TEMP"
      #     wget -q -O libicu70.deb \
      #       http://archive.ubuntu.com/ubuntu/pool/main/i/icu/libicu70_70.1-2_amd64.deb
      #     sudo dpkg -i libicu70.deb || sudo apt-get -f install -y
      #     sudo ldconfig

      - name: 恢复 ccache 缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-llvm${{ env.LLVM_VERSION }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-llvm${{ env.LLVM_VERSION }}-

      - name: ccache 状态（编译前）
        run: ccache -s || true

      - name: 生成 stock_defconfig
        run: make -s -j"$(nproc --all)" O=out ARCH=arm64 stock_defconfig

      - name: 编译内核
        run: |
          set -o pipefail
          make -j"$(nproc --all)" LLVM=1 LLVM_IAS=1 ARCH=arm64 \
               CC="ccache clang" HOSTCC="ccache clang" HOSTCXX="ccache clang++" \
               PYTHON=python3 O=out KCFLAGS=-Wno-error 2>&1 | tee build.log

      - name: ccache 状态（编译后）
        if: always()
        run: ccache -s || true

      - name: 检查产物
        run: |
          ls -l out/arch/arm64/boot/Image.gz-dtb
          ls -l out/System.map

      - name: 读取提交信息
        id: commit
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "subject=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"
          echo "kernel=$(make -s O=out ARCH=arm64 kernelrelease)" >> "$GITHUB_OUTPUT"

      - name: 制作 AnyKernel3 卡刷包
        continue-on-error: true
        run: |
          set -e
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's!block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!block=auto;!g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
          rm -rf AnyKernel3/.git* AnyKernel3/README.md
          (cd AnyKernel3 && zip -r9 "../AnyKernel3-${{ steps.commit.outputs.sha }}.zip" . > /dev/null)
          ls -l AnyKernel3-*.zip

      - name: 生成 Release 说明
        run: |
          {
            echo "提交: ${{ steps.commit.outputs.sha }}"
            echo "标题: ${{ steps.commit.outputs.subject }}"
            echo
            echo "内核版本: ${{ steps.commit.outputs.kernel }}"
            echo "配置文件: stock_defconfig"
            echo "工具链: LLVM ${{ env.LLVM_VERSION }} LLVM=1 LLVM_IAS=1"
            echo "编译者: ${{ env.KBUILD_BUILD_USER }}@${{ env.KBUILD_BUILD_HOST }}"
            echo
            echo "最近 5 个提交:"
            git log -5 --pretty='%h %s'
          } > "$RUNNER_TEMP/release-body.md"
          cat "$RUNNER_TEMP/release-body.md"

      - name: 发布 Release
        if: ${{ github.event_name == 'push' || inputs.make_release }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.commit.outputs.sha }}
          name: "${{ steps.commit.outputs.sha }} ${{ steps.commit.outputs.subject }}"
          body_path: ${{ runner.temp }}/release-body.md
          files: |
            out/arch/arm64/boot/Image.gz-dtb
            out/System.map
            AnyKernel3-*.zip

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ steps.commit.outputs.sha }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
