name: 编译内核 (LLVM 23)

# 手动触发；也可以直接往 android12 分支 push 自动触发
on:
  workflow_dispatch:
    inputs:
      make_release:
        description: 构建成功后自动发布 Release
        type: boolean
        default: true
  push:
    branches:
      - android12

# 发布 Release 需要写权限
permissions:
  contents: write

env:
  # 内嵌进内核版本信息的编译者（UTS_VERSION / LINUX_COMPILE_BY）
  KBUILD_BUILD_USER: "XinRan♡"
  KBUILD_BUILD_HOST: "Bai"

  # LLVM 工具链（官方发布包，Linux-X64 适用于 x86_64 runner）
  LLVM_VERSION: 23.1.2
  LLVM_DIR: LLVM-23.1.2-Linux-X64

  # ccache：后续编译加速
  CCACHE_MAXSIZE: 5G
  CCACHE_COMPILERCHECK: content
  CCACHE_SLOPPINESS: time_macros,file_stat_matches,include_file_ctime,include_file_mtime

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    env:
      TOOLCHAIN: ${{ github.workspace }}/toolchain
      CCACHE_DIR: ${{ github.workspace }}/.ccache

    steps:
      - name: 拉取内核源码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # runner 只有 ~14G 可用空间，先清掉预装的大件，避免后面解压/编译爆盘
      - name: 清理磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      "$AGENT_TOOLSDIRECTORY" /usr/share/swift 2>/dev/null || true
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            bc bison build-essential ccache cpio device-tree-compiler flex \
            git kmod libelf-dev libssl-dev python3 rsync wget xz-utils zip

      - name: 恢复 LLVM 工具链缓存
        id: llvm-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.TOOLCHAIN }}
          key: llvm-${{ runner.os }}-${{ env.LLVM_VERSION }}

      # 官方包解压后约 12G，这里只取内核构建真正需要的部分（约 1.6G）
      - name: 下载 LLVM ${{ env.LLVM_VERSION }}
        if: steps.llvm-cache.outputs.cache-hit != 'true'
        run: |
          set -e
          URL="https://github.com/llvm/llvm-project/releases/download/llvmorg-${LLVM_VERSION}/${LLVM_DIR}.tar.xz"
          echo "下载 $URL"
          wget -q --show-progress -O "$RUNNER_TEMP/llvm.tar.xz" "$URL"
          mkdir -p "$TOOLCHAIN"
          # 只解压必要的可执行文件 + 动态库 + clang 自带头文件
          tar -xJf "$RUNNER_TEMP/llvm.tar.xz" -C "$TOOLCHAIN" --wildcards \
            "${LLVM_DIR}/bin/clang"   "${LLVM_DIR}/bin/clang++" "${LLVM_DIR}/bin/clang-23" \
            "${LLVM_DIR}/bin/ld.lld"  "${LLVM_DIR}/bin/lld" \
            "${LLVM_DIR}/bin/llvm-ar" "${LLVM_DIR}/bin/llvm-ranlib" \
            "${LLVM_DIR}/bin/llvm-nm" \
            "${LLVM_DIR}/bin/llvm-objcopy" "${LLVM_DIR}/bin/llvm-strip" \
            "${LLVM_DIR}/bin/llvm-objdump" \
            "${LLVM_DIR}/bin/llvm-readobj" "${LLVM_DIR}/bin/llvm-readelf" \
            "${LLVM_DIR}/lib/*.so*" \
            "${LLVM_DIR}/lib/clang/*"
          rm -f "$RUNNER_TEMP/llvm.tar.xz"
          du -sh "$TOOLCHAIN"

      - name: 配置工具链到 PATH
        run: |
          echo "$TOOLCHAIN/$LLVM_DIR/bin" >> "$GITHUB_PATH"

      # LLVM 官方包的 lld 动态链接了 libicu70，而 Ubuntu 24.04 只有 libicu74
      - name: 补齐 lld 运行库 (libicu70)
        run: |
          set -e
          BIN="$TOOLCHAIN/$LLVM_DIR/bin"
          if ldd "$BIN/ld.lld" | grep -q "not found"; then
            echo "检测到缺失依赖，安装 libicu70"
            cd "$RUNNER_TEMP"
            wget -q -O libicu70.deb \
              http://archive.ubuntu.com/ubuntu/pool/main/i/icu/libicu70_70.1-2_amd64.deb
            sudo dpkg -i libicu70.deb || sudo apt-get -f install -y
            sudo ldconfig
          fi
          ldd "$BIN/ld.lld" | grep "not found" && { echo "仍有缺失依赖"; exit 1; } || true
          "$BIN/clang" --version
          "$BIN/ld.lld" --version

      - name: 恢复 ccache 缓存
        uses: actions/cache@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: ccache-${{ runner.os }}-llvm${{ env.LLVM_VERSION }}-${{ github.sha }}
          restore-keys: |
            ccache-${{ runner.os }}-llvm${{ env.LLVM_VERSION }}-

      - name: ccache 状态（编译前）
        run: ccache -s -v || true

      - name: 生成 stock_defconfig
        run: make -s -j"$(nproc --all)" O=out ARCH=arm64 stock_defconfig

      - name: 编译内核 (LLVM=1 + LLVM_IAS=1)
        run: |
          set -o pipefail
          make -j"$(nproc --all)" LLVM=1 LLVM_IAS=1 ARCH=arm64 \
               CC="ccache clang" HOSTCC="ccache clang" HOSTCXX="ccache clang++" \
               PYTHON=python3 O=out KCFLAGS=-Wno-error 2>&1 | tee build.log

      - name: ccache 状态（编译后）
        if: always()
        run: ccache -s -v || true

      - name: 检查产物
        run: |
          ls -l out/arch/arm64/boot/Image.gz-dtb
          ls -l out/System.map

      - name: 读取 commit 信息
        id: commit
        run: |
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "subject=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"
          echo "kernel=$(make -s O=out ARCH=arm64 kernelrelease)" >> "$GITHUB_OUTPUT"

      - name: 制作 AnyKernel3 卡刷包
        id: ak3
        continue-on-error: true
        run: |
          set -e
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3.git
          cp out/arch/arm64/boot/Image.gz-dtb AnyKernel3/
          sed -i 's/do.devicecheck=1/do.devicecheck=0/g' AnyKernel3/anykernel.sh
          sed -i 's!block=/dev/block/platform/omap/omap_hsmmc.0/by-name/boot;!block=auto;!g' AnyKernel3/anykernel.sh
          sed -i 's/is_slot_device=0;/is_slot_device=auto;/g' AnyKernel3/anykernel.sh
          rm -rf AnyKernel3/.git* AnyKernel3/README.md
          (cd AnyKernel3 && zip -r9 "../AnyKernel3-${{ steps.commit.outputs.sha }}.zip" . > /dev/null)
          ls -l AnyKernel3-*.zip

      - name: 生成 Release 说明
        run: |
          {
            echo "## \`${{ steps.commit.outputs.sha }}\` ${{ steps.commit.outputs.subject }}"
            echo
            echo '~~~'
            git log -1 --pretty='commit  %H%nauthor  %an <%ae>%ndate    %ad%n%n%B'
            echo '~~~'
            echo
            echo "| 项目 | 值 |"
            echo "| --- | --- |"
            echo "| 内核版本 | \`${{ steps.commit.outputs.kernel }}\` |"
            echo "| 配置文件 | \`stock_defconfig\` |"
            echo "| 工具链 | LLVM ${{ env.LLVM_VERSION }}（\`LLVM=1 LLVM_IAS=1\`，集成汇编器） |"
            echo "| 编译者 | \`${{ env.KBUILD_BUILD_USER }}@${{ env.KBUILD_BUILD_HOST }}\` |"
            echo
            echo "刷机用 \`AnyKernel3-*.zip\`（卡刷包），或直接用 \`Image.gz-dtb\` 替换 boot 镜像。"
          } > "$RUNNER_TEMP/release-body.md"
          cat "$RUNNER_TEMP/release-body.md"

      - name: 发布 Release
        if: ${{ github.event_name == 'push' || inputs.make_release }}
        uses: softprops/action-gh-release@v2
        with:
          # tag 用提交短哈希，release 标题用「哈希 + 提交标题」
          tag_name: ${{ steps.commit.outputs.sha }}
          name: "${{ steps.commit.outputs.sha }} + ${{ steps.commit.outputs.subject }}"
          body_path: ${{ runner.temp }}/release-body.md
          files: |
            out/arch/arm64/boot/Image.gz-dtb
            out/System.map
            AnyKernel3-*.zip

      - name: 上传构建日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ steps.commit.outputs.sha }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 7
